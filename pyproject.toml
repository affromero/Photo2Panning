[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pic2panning"
version = "0.2.0"
description = "Photo motion, video processing, and local image editing on Apple Silicon."
readme = "readme.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "Andres Romero", email = "me@afromero.co"}]
dependencies = ["klogr>=0.2.1", "pillow>=12.3.0,<13", "pydantic>=2.14.1"]

[project.optional-dependencies]
models = ["beartype>=0.23.1", "jaxtyping>=0.3.3", "mflux==0.23.0", "numpy>=2.5.4", "torch>=2.14.1", "torchvision>=0.29.1"]
youtube = ["yt-dlp>=2026.10.21"]

[project.scripts]
pic2panning = "pic2panning.cli:main"

[project.urls]
Repository = "https://github.com/affromero/Photo2Panning"

[dependency-groups]
dev = ["mypy>=2.4.0", "pre-commit>=4.7.0", "pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff==0.17.2", "ty>=0.0.91"]

[tool.hatch.build.targets.wheel]
packages = ["pic2panning"]

[tool.uv]
required-version = ">=0.11.17"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["pic2panning", "tests", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = ["models: optional local model inference requiring downloaded weights"]

[tool.coverage.run]
source = ["pic2panning"]
branch = true

[tool.ty.src]
include = ["pic2panning", "tests", "scripts"]
