[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pic2panning"
version = "0.3.1"
description = "Photo motion, video processing, and local image editing on Apple Silicon."
readme = "readme.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "Andres Romero", email = "me@afromero.co"}]
dependencies = ["klogr>=0.2.1", "numpy>=2.5.4", "pillow>=12.3.0,<13", "pydantic>=2.14.1", "tyro==1.0.16"]

[project.optional-dependencies]
models = ["beartype>=0.23.1", "jaxtyping>=0.3.3", "mflux==0.23.0", "torch>=2.14.1", "torchvision>=0.29.1"]
camera = [
  "beartype>=0.23.1",
  "jaxtyping>=0.3.3",
  "mlx3d @ git+https://github.com/amirhossein-razlighi/mlx3D.git@29ba415cc8a9004750b44fe9083e1ce6715d5f0d",
  "moge @ git+https://github.com/microsoft/MoGe.git@925b8ed835a7a9cdb7578ba15c658a0afc969030",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
]
youtube = ["yt-dlp>=2026.10.21"]
video = [
  "ltx-core-mlx @ git+https://github.com/dgrauet/ltx-2-mlx.git@f14dbf930626eafd86b9f29030ac7a23b4e914b8#subdirectory=packages/ltx-core-mlx",
  "ltx-pipelines-mlx @ git+https://github.com/dgrauet/ltx-2-mlx.git@f14dbf930626eafd86b9f29030ac7a23b4e914b8#subdirectory=packages/ltx-pipelines-mlx",
]

[project.scripts]
pic2panning = "pic2panning.cli:main"

[project.urls]
Repository = "https://github.com/affromero/Photo2Panning"

[dependency-groups]
dev = ["mypy>=2.4.0", "pre-commit>=4.7.0", "pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff==0.17.2", "ty>=0.0.91"]

[tool.hatch.build.targets.wheel]
packages = ["pic2panning"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.11.17"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["pic2panning", "tests", "scripts", "examples"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = ["models: optional local model inference requiring downloaded weights"]

[tool.coverage.run]
source = ["pic2panning"]
branch = true

[tool.ty.src]
include = ["pic2panning", "tests", "scripts", "examples"]
