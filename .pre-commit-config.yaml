default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
  - repo: local
    hooks:
      - id: locked-dependencies
        name: Verify the uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff-check
        name: Ruff correctness and style
        entry: .venv/bin/ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff formatting
        entry: .venv/bin/ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: .venv/bin/ty check --error-on-warning
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: project-policy
        name: Python project policy
        entry: .venv/bin/python scripts/hooks/check_policy.py
        language: system
        types: [python]
      - id: array-annotations
        name: Shaped array annotations
        entry: bash scripts/hooks/python/check_array_annotations.sh
        language: system
        types: [python]
      - id: declared-attributes
        name: Declared instance attributes
        entry: bash scripts/hooks/python/models/check_declared_instance_attrs.sh
        language: system
        types: [python]
      - id: source-size
        name: Source file size
        entry: bash scripts/hooks/check_file_line_count.sh
        language: system
        types_or: [python, shell]
      - id: directory-size
        name: Source directory size
        entry: bash scripts/hooks/check_directory_file_count.sh --include-regex '\.(py|sh)$'
        language: system
        pass_filenames: false
        always_run: true
      - id: tests-location
        name: Tests live under root tests
        entry: bash scripts/hooks/check_tests_under_tests.sh
        language: system
        pass_filenames: false
        always_run: true
